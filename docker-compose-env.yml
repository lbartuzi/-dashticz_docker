version: '3.8'

services:
  dashticz:
    image: dashticz:latest
    container_name: ${CONTAINER_NAME:-dashticz}
    
    ports:
      - "${DASHTICZ_PORT:-8082}:80"
    
    environment:
      # Domoticz settings
      DOMOTICZ_IP: ${DOMOTICZ_IP:-192.168.1.100:8080}
      DOMOTICZ_USERNAME: ${DOMOTICZ_USERNAME:-}
      DOMOTICZ_PASSWORD: ${DOMOTICZ_PASSWORD:-}
      
      # PHP settings
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-50M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-50M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      
      # System settings
      TZ: ${TIMEZONE:-Europe/Amsterdam}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      
      # Debug mode
      DEBUG_MODE: ${DEBUG_MODE:-false}
    
    volumes:
      # Using named volumes - these will preserve container data
      - dashticz-custom:/var/www/html/dashticz/custom
      - dashticz-img:/var/www/html/dashticz/img
      - dashticz-logs:/var/log/apache2
      
      # System time
      - /etc/localtime:/etc/localtime:ro
    
    restart: ${RESTART_POLICY:-unless-stopped}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    
    networks:
      - dashticz-network

# Named volumes - Docker will auto-populate these with container content
volumes:
  dashticz-custom:
    driver: local
  dashticz-img:
    driver: local
  dashticz-logs:
    driver: local

networks:
  dashticz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
